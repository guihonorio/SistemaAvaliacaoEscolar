name: CI - Sistema de Avaliação Escolar
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    name: Build e Testes (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5
      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache do Maven
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Compilar e executar os testes
        run: mvn -B clean verify
      - name: Publicar relatório de testes (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-testes
          path: target/surefire-reports/
      - name: Publicar artefato do JAR
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: sistema-avaliacao-jar
          path: target/*.jar